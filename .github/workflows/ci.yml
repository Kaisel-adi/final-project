name: GCIR CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Boundary ETL Pipeline
        run: |
          python scripts/etl_boundaries.py

      - name: Run Automated Unit & Integration Tests
        run: |
          python -m pytest tests/ -v

      - name: Run ML Duplicate Detection Benchmark
        run: |
          python scripts/evaluate_ml.py
