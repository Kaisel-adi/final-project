{% extends "base.html" %}

{% block title %}Verify Your Email — GCIR{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 2rem auto;">
    <div class="card" style="text-align: center;">
        <div style="width: 60px; height: 60px; border-radius: 50%; background: #e8f0fe; color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 1rem auto;">
            ✉️
        </div>

        <h2 style="font-size: 1.45rem; margin-bottom: 0.35rem; color: var(--text-primary);">Verify Your Email</h2>
        <p style="color: var(--text-secondary); font-size: 0.88rem; margin-bottom: 1.5rem; line-height: 1.5;">
            We sent a 6-digit verification code to:<br>
            <strong style="color: var(--text-primary); font-size: 0.95rem;">{{ email }}</strong>
        </p>

        <!-- OTP Submission Form -->
        <form method="POST" action="{{ url_for('auth.verify_otp') }}">
            <input type="hidden" name="email" value="{{ email }}">

            <div class="form-group" style="text-align: left;">
                <label class="form-label" for="otp" style="text-align: center; display: block; font-size: 0.88rem;">
                    Enter 6-Digit Code
                </label>
                <input class="form-input" 
                       type="text" 
                       id="otp" 
                       name="otp" 
                       required 
                       maxlength="6" 
                       pattern="[0-9]{6}" 
                       inputmode="numeric" 
                       autocomplete="one-time-code" 
                       placeholder="••••••" 
                       autofocus
                       style="font-size: 1.8rem; font-weight: 700; letter-spacing: 8px; text-align: center; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; padding: 0.6rem;">
                <span style="display: block; text-align: center; font-size: 0.78rem; color: var(--text-secondary); margin-top: 0.35rem;">
                    Code expires in 15 minutes.
                </span>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
                Verify & Create Account
            </button>
        </form>

        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 1.5rem 0;">

        <!-- Resend Code Action -->
        <div style="font-size: 0.88rem; color: var(--text-secondary);">
            Didn't receive the email? Check spam or
            <form method="POST" action="{{ url_for('auth.resend_otp') }}" style="display: inline-block; margin-top: 0.35rem;">
                <input type="hidden" name="email" value="{{ email }}">
                <button type="submit" class="btn btn-secondary btn-sm" id="btn-resend" style="font-size: 0.82rem;">
                    🔄 Resend Code
                </button>
            </form>
        </div>

        <div style="margin-top: 1.25rem; font-size: 0.85rem;">
            <a href="{{ url_for('auth.register') }}" style="color: var(--text-secondary); text-decoration: underline;">
                Use a different email address
            </a>
        </div>
    </div>
</div>
{% endblock %}
