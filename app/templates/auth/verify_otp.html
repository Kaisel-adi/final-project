{% extends "base.html" %}

{% block title %}Verify Your Email — Garuda{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-8 sm:py-12">
    <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-8 text-center space-y-6">
        
        <!-- Header -->
        <div>
            <div class="w-14 h-14 rounded-2xl bg-emerald-100 text-brand-green flex items-center justify-center mx-auto mb-3">
                <span class="material-symbols-outlined text-[32px]">mark_email_read</span>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Verify Your Email</h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">
                We sent a 6-digit confirmation code to:
            </p>
            <div class="inline-block mt-1.5 px-3 py-1 rounded-lg bg-slate-100 font-bold text-slate-800 text-sm">
                {{ email }}
            </div>
        </div>

        <!-- OTP Submission Form -->
        <form method="POST" action="{{ url_for('auth.verify_otp') }}" class="space-y-4">
            <input type="hidden" name="email" value="{{ email }}">

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2" for="otp">
                    Enter 6-Digit Code
                </label>
                <input class="w-full py-3 px-4 rounded-2xl border-2 border-slate-200 focus:border-brand-green focus:ring-4 focus:ring-brand-green/10 text-slate-900 text-2xl sm:text-3xl font-extrabold tracking-[0.5em] text-center font-mono transition-all" 
                       type="text" 
                       id="otp" 
                       name="otp" 
                       required 
                       maxlength="6" 
                       pattern="[0-9]{6}" 
                       inputmode="numeric" 
                       autocomplete="one-time-code" 
                       placeholder="••••••" 
                       autofocus>
                <p class="text-[11px] text-slate-400 mt-2">
                    Code expires in 15 minutes.
                </p>
            </div>

            <button type="submit" 
                    class="w-full py-3 px-4 rounded-xl bg-brand-green hover:bg-emerald-600 text-white font-bold text-sm shadow-sm transition-colors flex items-center justify-center gap-2">
                <span>Verify & Activate Account</span>
                <span class="material-symbols-outlined text-[18px]">verified</span>
            </button>
        </form>

        <hr class="border-slate-100 my-4">

        <!-- Resend Code Action -->
        <div class="text-xs sm:text-sm text-slate-500">
            Didn't receive the email? Check spam or
            <div class="mt-2">
                <form method="POST" action="{{ url_for('auth.resend_otp') }}" class="inline-block">
                    <input type="hidden" name="email" value="{{ email }}">
                    <button type="submit" 
                            class="inline-flex items-center gap-1 px-3 py-1.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-semibold shadow-xs transition-colors">
                        <span class="material-symbols-outlined text-[16px]">refresh</span>
                        <span>Resend Code</span>
                    </button>
                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}
